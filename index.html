<!DOCTYPE html>
<html>
	<head>
		<title>What's the Angle?</title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				font-family: Courier, monospace;
			}
			body {
				font-family: var(--font-sans);
			}
			main {
				display: flex;
				flex-direction: column;
				padding: 2rem 1rem;
				gap: 1.5rem;
				width: 100%;
				height: 100%;
				align-items: center;
				justify-content: start;
			}


			.angle {
				position: relative;
				border: 1px solid black;
				min-width: 200px;
				min-height: 200px;
			}

			.line {
				position: absolute;
				left: 100px;
				top: 100px;
				width: 100px;
				border-top: 2px solid black;
				transform-origin: left center;
			}

			.two {
				transform: rotate(0deg);
			}

			.fill {
				position: absolute;
				left: 20px;
				top: 20px;
				width: 160px;
				height: 160px;
				border-radius: 50%;
			}

			.vertex {
				position: absolute;
				left: -3px;
				top: -4px;
				width: 6px;
				height: 6px;
				background-color: black;
				border-radius: 50%;
			}





			input[type=number] {
				width: 100px;
				padding: 0.2rem;
				font-size: 1rem;
				border: 1px solid black;
			}
			button {
				padding: 0.2rem 0.6rem;
				font-size: 1rem;
				border-radius: 0%;
				border: 1px solid black;
			}
			.row {
				display: flex;
				align-items: center;
				gap: 0.75rem;
			}
			.hint {font-style: italic; color: rgba(255, 0, 0, 0.600);}
		</style>
	</head>

	<body>

		<main>
		
			<div class="angle">
				<div class="fill"></div>
				<div class="line one"></div>
				<div class="line two">
					<div class="vertex"></div>
				</div>
			</div>

			<div class="row">
				<input type="number" id="guess" placeholder="°" min="0" max="360" />
				<button onclick="checkGuess()">Guess</button>
				<button onclick="newAngle()">New angle</button>
			</div>

			<div class="hint" id="hint">what do you think the angle is?</div>
			<div class="score" id="score">Score: 0 &nbsp;|&nbsp; Guesses: 0</div>

		</main>

		<script>
			let current = 0, score = 0, prevGuess = null;

			function newAngle() {
				current = Math.floor(Math.random() * 360) + 1;
				document.querySelector('.one').style.transform = `rotate(-${current}deg)`;
				document.querySelector('.fill').style.background = `conic-gradient(
					from 90deg,
					transparent 0deg ${360 - current}deg,
					rgba(255,0,0,.25) ${360 - current}deg 360deg
				)`;
				console.log(current);
			}

			function showHint(message) {
				document.getElementById("hint").textContent = message;
			}

			function checkGuess() {
				const guess = Number(document.getElementById("guess").value);
				
				if (guess === current) {
					showHint("Correct!");
					newAngle();
					prevGuess = null;
				} else {
					const diff = Math.abs(guess - current);
					if (prevGuess === null) {
						if (diff <= 5) {
							showHint("you're so close!");
						} else if (diff <= 10) {
							showHint("pretty good guess.");
						} else if (diff <= 15) {
							showHint("decent guess.");
						} else if (diff <= 20) {
							showHint("that's a guess ig.");
						} else if (diff <= 25) {
							showHint("you can do better.");
						} else {
							showHint("that's just a bad guess.");
						}
					} else {
						const prevDiff = Math.abs(prevGuess - current);
						if (diff < prevDiff) {
							showHint("getting closer...");
						} else if (diff > prevDiff) {
							showHint("getting further away now...");
						} else {
							showHint("it's like you didn't move at all.");
						}
					}
					prevGuess = guess;
				}
			}

			newAngle();
		</script>
	</body>
</html>
