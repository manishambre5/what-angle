<!DOCTYPE html>
<html>
	<head>
		<title>What's the Angle?</title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				font-family: Courier, monospace;
			}
			body {
				font-family: var(--font-sans);
				display: flex;
				flex-direction: column;
				align-items: center;
				padding: 2rem 1rem;
				gap: 1.5rem;
			}


			.angle {
				position: relative;
				width: 200px;
				height: 200px;
			}

			.line {
				position: absolute;
				left: 100px;
				top: 100px;
				width: 100px;
				border-top: 2px solid black;
				transform-origin: left center;
			}

			.two {
				transform: rotate(0deg);
			}

			.fill {
				position: absolute;
				left: 20px;
				top: 20px;
				width: 160px;
				height: 160px;
				border-radius: 50%;
			}

			.vertex {
				position: absolute;
				left: -3px;
				top: -4px;
				width: 6px;
				height: 6px;
				background-color: black;
				border-radius: 50%;
			}





			input[type=number] {
				width: 100px;
				padding: 0.2rem;
				text-align: center;
				font-size: 1rem;
				border: 1px solid black;
			}
			button {
				padding: 0.2rem 0.6rem;
				font-size: 1rem;
				border-radius: 0%;
				border: 1px solid black;
			}
			.row {
				display: flex;
				align-items: center;
				gap: 0.75rem;
			}
		</style>
	</head>

	<body>
		<div class="angle">
			<div class="fill"></div>
			<div class="line one"></div>
			<div class="line two">
				<div class="vertex"></div>
			</div>
		</div>

		<div class="row">
			<input type="number" id="guess" placeholder="°" min="-180" max="180" />
			<button onclick="checkGuess()">Guess</button>
			<button onclick="newAngle()">New angle</button>
		</div>

		<div class="feedback" id="feedback"></div>
		<div class="score" id="score">Score: 0 &nbsp;|&nbsp; Guesses: 0</div>

		<script>
			let current = 0, score = 0;

			function newAngle() {
				current = Math.floor(Math.random() * 360) + 1;
				document.querySelector('.one').style.transform = `rotate(-${current}deg)`;
				document.querySelector('.fill').style.background = `conic-gradient(
					from 90deg,
					transparent 0deg ${360 - current}deg,
					rgba(255,0,0,.25) ${360 - current}deg 360deg
				)`;
				console.log(current);
			}

			newAngle();
		</script>
	</body>
</html>
